# Aider model settings for Qwen3.8-27B served by vllm-neuron (examples/vllm_neuron/models/qwen3_5/serve.sh) on trn2.3xlarge.
# Thinking mode with Qwen's recommended sampling. No max_tokens: vLLM rejects requests where
# prompt + max_tokens > max_model_len, and by default it allows up to the rest of the context.
# The name is openai/<served model name> (serve.sh: the checkpoint directory name).
- name: openai/qwen3.8-27b
  edit_format: diff
  use_repo_map: false
  reasoning_tag: think
  use_temperature: 0.6
  extra_params:
    top_p: 0.95
    extra_body:
      top_k: 20
      min_p: 0.0
