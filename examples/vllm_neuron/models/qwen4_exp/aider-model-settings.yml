# Aider model settings for Qwen3.8-Flash-Next served by vllm-neuron (OpenAI-compatible server).
# Thinking mode with the sampling the Qwen3.8-Flash-Next model card recommends for it
# (https://huggingface.co/Qwen/Qwen3.8-Flash-Next, "Best Practices"): temperature=1.0, top_p=0.95,
# top_k=20, min_p=0.0, presence_penalty=0.0, repetition_penalty=1.0. (Non-thinking mode is
# different: temperature=0.7, top_p=0.80, presence_penalty=1.5.)
# No max_tokens: vLLM rejects requests where prompt + max_tokens > max_model_len, and by default
# it allows up to the rest of the context.
# The name is openai/<served model name>.
#
# Reasoning controls (enable_thinking, preserve_thinking, reasoning_effort) are left at the chat
# template's defaults (thinking on, preserve thinking on, effort xhigh). run_aider_polyglot.sh
# sets them per run (REASONING_EFFORT, ENABLE_THINKING, PRESERVE_THINKING) by appending to
# extra_body, so keep extra_body the last block of this file.
- name: openai/qwen3.8-flash-next
  edit_format: diff
  use_repo_map: false
  # With the server's reasoning parser off, the reply is "<thinking>...</think>\n\n<answer>"
  # (the template's generation prompt already opened <think>); Aider drops everything up to
  # </think>. With a reasoning parser on, the thinking arrives in reasoning_content instead.
  reasoning_tag: think
  use_temperature: 1.0
  extra_params:
    # Thinking responses of tens of thousands of tokens at batch 8 take over 10 minutes; Aider's
    # default 600 s request timeout abandons and retries them.
    timeout: 3600
    top_p: 0.95
    presence_penalty: 0.0
    extra_body:
      top_k: 20
      min_p: 0.0
      repetition_penalty: 1.0
